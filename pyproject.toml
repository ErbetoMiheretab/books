[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amharic-ocr"
version = "0.1.0"
description = "High-accuracy pipeline for scanned/photographed Amharic text extraction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "easyocr>=1.7.2",
    "opencv-python-headless>=4.13.0.92",
    "pdf2image>=1.17.0",
    "pillow>=12.1.0",
    "pymupdf>=1.26.7",
    "pytesseract>=0.3.13",
]

[project.scripts]
amharic-ocr = "amharic_ocr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/amharic_ocr"]
